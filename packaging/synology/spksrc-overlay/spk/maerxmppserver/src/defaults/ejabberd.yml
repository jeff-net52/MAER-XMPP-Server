### Canonical single-domain profile for MAER Chat.
### The service intentionally refuses to start until xmpp.pem is installed.

hosts:
  - xmpp.maer.fr

language: fr
loglevel: info
hide_sensitive_log_data: true
log_rotate_size: 10485760
log_rotate_count: 5

certfiles:
  - /var/packages/maerxmppserver/var/certs/xmpp.pem

auth_method: sql
auth_stored_password_types:
  - scram_sha256
default_db: sql
default_ram_db: mnesia

sql_type: sqlite
sql_database: /var/packages/maerxmppserver/var/data/ejabberd.sqlite
sql_pool_size: 1
sql_schema_multihost: true
update_sql_schema: true

listen:
  -
    port: 5222
    ip: 0.0.0.0
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls_required: true
  -
    port: 5280
    ip: 127.0.0.1
    module: ejabberd_http
    request_handlers:
      /admin: ejabberd_web_admin
  -
    port: 5443
    ip: 0.0.0.0
    module: ejabberd_http
    tls: true
    request_handlers:
      /maer-pairing: mod_maer_pairing
      /http-bind: mod_bosh
      /xmpp-websocket: ejabberd_http_ws
      /.well-known/host-meta: mod_host_meta
      /.well-known/host-meta.json: mod_host_meta
      /upload: mod_http_upload

s2s_access: s2s

acl:
  admin:
    user:
      - admin@xmpp.maer.fr
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128

access_rules:
  local:
    allow: local
  c2s:
    allow: all
  configure:
    allow: admin
  maer_private_muc:
    allow: local
  pubsub_createnode:
    allow: local
  s2s:
    deny: all

api_permissions:
  "console commands":
    from: ejabberd_ctl
    who: all
    what: "*"
  "webadmin commands":
    from: ejabberd_web_admin
    who: admin
    what: "*"

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  c2s_shaper:
    none: admin
    normal: all

modules:
  mod_adhoc: {}
  mod_auth_fast:
    db_type: sql
  mod_avatar: {}
  mod_blocking: {}
  mod_bosh: {}
  mod_caps:
    db_type: sql
  mod_carboncopy: {}
  mod_client_state: {}
  mod_disco: {}
  mod_fail2ban: {}
  mod_host_meta:
    bosh_service_url: https://xmpp.maer.fr:5443/http-bind
    websocket_url: wss://xmpp.maer.fr:5443/xmpp-websocket
  mod_http_upload:
    docroot: /var/packages/maerxmppserver/var/upload
    put_url: https://xmpp.maer.fr:5443/upload
    max_size: 52428800
    file_mode: "0600"
    dir_mode: "0700"
    custom_headers:
      Access-Control-Allow-Origin: https://xmpp.maer.fr
      Access-Control-Allow-Methods: GET,HEAD,PUT,OPTIONS
      Access-Control-Allow-Headers: Content-Type
  mod_last:
    db_type: sql
  mod_maer_pairing: {}
  mod_mam:
    db_type: sql
    assume_mam_usage: true
    default: always
  mod_muc:
    db_type: sql
    ram_db_type: mnesia
    hosts:
      - conference.xmpp.maer.fr
    access: maer_private_muc
    access_create: maer_private_muc
    access_persistent: maer_private_muc
    access_mam: maer_private_muc
    access_register: maer_private_muc
    default_room_options:
      allow_user_invites: false
      mam: true
      members_only: true
      persistent: true
      public: false
      public_list: false
  mod_muc_admin: {}
  mod_offline:
    db_type: sql
  mod_ping: {}
  mod_privacy:
    db_type: sql
  mod_private:
    db_type: sql
  mod_pubsub:
    db_type: sql
    access_createnode: pubsub_createnode
    last_item_cache: false
    plugins:
      - flat
      - pep
    force_node_config:
      storage:bookmarks:
        access_model: whitelist
  mod_push:
    db_type: sql
    include_body: false
  mod_push_keepalive: {}
  mod_roster:
    db_type: sql
    versioning: true
  mod_stream_mgmt:
    resend_on_timeout: if_offline
  mod_vcard:
    db_type: sql
  mod_vcard_xupdate: {}
  mod_version:
    show_os: false
